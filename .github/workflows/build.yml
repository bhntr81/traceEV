# One tag, three downloads.
#
# PyInstaller cannot cross-compile -- it packages the runtime of the machine
# it runs on -- so a Mac build has to happen on a Mac and a Linux build on
# Linux. That is the whole reason this file exists: it rents all three
# machines for a minute each rather than asking anybody to own them.
#
# The checks run first and the build only follows a pass, because a green
# download is worse than no download if the program inside it is wrong.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Tk is part of Python on Windows and macOS and is a separate package
      # on Linux, where without it the program imports and then cannot open
      # a window -- which looks like a crash rather than a missing package.
      - name: Install Tk
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # The parts that do not need a database. The rest of the checks read
      # hands, and there are none here: hand histories are the user's data
      # and are not in the repository.
      - name: Check what runs without hands
        run: |
          python -c "import app, query, stats, lines, decisions, spots, equity, importer, diag"
          python diag.py --check
          python build.py --check

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: python build.py

      # The program has been TraceEV since 15 Sep 2026; the paths here still
      # said poker_analysis until 17 Sep, so every tagged build failed at
      # this step with "no files found" and the downloads page the window
      # points people to stayed empty.
      - uses: actions/upload-artifact@v4
        with:
          name: TraceEV-${{ matrix.name }}
          path: |
            dist/TraceEV.exe
            dist/TraceEV.app
            dist/TraceEV
          if-no-files-found: error

  # One release per tag, with the three downloads on it. That page is where
  # a packaged build sends its user for the newer version, so it has to
  # exist with something on it; artifacts alone live on the run page and
  # expire.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Name the files by platform
        run: |
          mkdir out
          cp downloads/TraceEV-windows/TraceEV.exe out/TraceEV-windows.exe
          cp downloads/TraceEV-linux/TraceEV out/TraceEV-linux
          cd downloads/TraceEV-macos && zip -r ../../out/TraceEV-macos.zip . && cd ../..
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" --generate-notes \
            --title "TraceEV ${{ github.ref_name }}"
