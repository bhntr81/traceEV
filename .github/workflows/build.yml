# One tag, three downloads.
#
# PyInstaller cannot cross-compile -- it packages the runtime of the machine
# it runs on -- so a Mac build has to happen on a Mac and a Linux build on
# Linux. That is the whole reason this file exists: it rents all three
# machines for a minute each rather than asking anybody to own them.
#
# The checks run first and the build only follows a pass, because a green
# download is worse than no download if the program inside it is wrong.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Tk is part of Python on Windows and macOS and is a separate package
      # on Linux, where without it the program imports and then cannot open
      # a window -- which looks like a crash rather than a missing package.
      - name: Install Tk
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      # The parts that do not need a database. The rest of the checks read
      # hands, and there are none here: hand histories are the user's data
      # and are not in the repository.
      #
      # `diag.py --check` opens a window to prove a Tk callback's error is
      # logged, and a Linux runner has no screen to open it on, so there it
      # runs under a virtual display, as check.yml's window checks do. The
      # first build ever run, on 5 Oct 2026, built Windows and macOS and
      # stopped Linux here with exit 1 and nothing printed.
      - name: Check what runs without hands
        shell: bash
        run: |
          screen=""
          if [ "$RUNNER_OS" = "Linux" ]; then screen="xvfb-run -a"; fi
          python -c "import app, query, stats, lines, decisions, spots, equity, importer, diag"
          $screen python diag.py --check
          python build.py --check

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: python build.py

      # Open the built program the way a tester does: on its own, in an
      # empty folder, with no database and nothing else. The first beta did
      # nothing at all when opened, on 6 Oct 2026 -- it refused to start
      # without a database and said so on a console a windowed build does
      # not have -- and every check had passed, because nothing here had
      # ever launched what it shipped. A first launch makes `hands.db` before
      # the window opens, so its appearing, with no traceback in the log,
      # is the program having started. Not on macOS, whose .app keeps its
      # executable inside the bundle and opens differently.
      - name: Open it with no database
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir fresh
          if [ "$RUNNER_OS" = "Windows" ]; then exe=TraceEV.exe; else exe=TraceEV; fi
          cp "dist/$exe" fresh/
          cd fresh
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "./$exe" --no-update &
          else
            "./$exe" --no-update &
          fi
          for i in $(seq 90); do [ -f hands.db ] && break; sleep 1; done
          sleep 5
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //T //IM "$exe" || true
          else
            pkill -f "$exe" || true
          fi
          ls -la
          [ -f TraceEV.log ] && cat TraceEV.log
          if [ ! -f hands.db ]; then
            echo "the program did not start: no hands.db after 90 seconds"
            exit 1
          fi
          if [ -f TraceEV.log ] && grep -q Traceback TraceEV.log; then
            echo "the program started and then failed"
            exit 1
          fi

      # The program has been TraceEV since 15 Sep 2026; the paths here still
      # said poker_analysis until 17 Sep, so every tagged build failed at
      # this step with "no files found" and the downloads page the window
      # points people to stayed empty.
      - uses: actions/upload-artifact@v4
        with:
          name: TraceEV-${{ matrix.name }}
          path: |
            dist/TraceEV.exe
            dist/TraceEV.app
            dist/TraceEV
          if-no-files-found: error

  # One release per tag, with the three downloads on it. That page is where
  # a packaged build sends its user for the newer version, so it has to
  # exist with something on it; artifacts alone live on the run page and
  # expire.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Name the files by platform
        run: |
          mkdir out
          cp downloads/TraceEV-windows/TraceEV.exe out/TraceEV-windows.exe
          cp downloads/TraceEV-linux/TraceEV out/TraceEV-linux
          cd downloads/TraceEV-macos && zip -r ../../out/TraceEV-macos.zip . && cd ../..
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix, v0.1.0-beta, is a pre-release: GitHub
          # labels it so and keeps it off "Latest", which is what a beta
          # tester should see and what a later paid release should replace.
          pre=""
          case "${{ github.ref_name }}" in *-*) pre="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" out/* $pre \
            --repo "${{ github.repository }}" --generate-notes \
            --title "TraceEV ${{ github.ref_name }}"
